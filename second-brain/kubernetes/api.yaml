apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-brain-api
  namespace: second-brain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: second-brain-api
  template:
    metadata:
      labels:
        app: second-brain-api
    spec:
      containers:
        - name: api
          image: second-brain-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/second_brain
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: second-brain-secrets
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: second-brain-secrets
                  key: postgres-password
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: NEO4J_URI
              value: bolt://neo4j:7687
            - name: MINIO_ENDPOINT
              value: http://minio:9000
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: second-brain-api
  namespace: second-brain
spec:
  selector:
    app: second-brain-api
  ports:
    - port: 8080
  type: LoadBalancer
