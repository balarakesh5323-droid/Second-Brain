apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: second-brain-ingress
  namespace: second-brain
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: second-brain.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: second-brain-api
                port:
                  number: 8080
