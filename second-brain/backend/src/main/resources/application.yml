spring:
  application:
    name: second-brain

  datasource:
    url: jdbc:postgresql://localhost:5432/second_brain
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

qdrant:
  host: localhost
  port: 6334
  grpc-port: 6334

neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:password}

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin

ollama:
  base-url: http://192.168.0.114:11434
  embedding-model: all-minilm
  embedding-dimensions: 384

github:
  clone-base-dir: /data/repos
  token: ${GITHUB_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
